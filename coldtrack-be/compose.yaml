name: coldtrack-be
x-app: &app
  restart: unless-stopped
  init: true
  environment: &environment
    NODE_ENV: production
    DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
    MQTT_URL: mqtts://mosquitto:8883
    MQTT_CA_FILE: /run/mqtt/ca.crt
  volumes:
    - ./infra/mosquitto/certs/ca.crt:/run/mqtt/ca.crt:ro
  depends_on:
    mosquitto:
      condition: service_started
services:
  # Invitation mail only; Supabase Auth keeps its existing Mailpit/configuration.
  mailpit:
    image: public.ecr.aws/supabase/mailpit:v1.31.3
    ports:
      - '127.0.0.1:54325:1025'
      - '127.0.0.1:54326:8025'
    restart: unless-stopped
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - '127.0.0.1:8883:8883'
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
  mosquitto-test:
    image: eclipse-mosquitto:2
    profiles: [tls-test]
    command: [mosquitto, -c, /mosquitto/config/mosquitto-test.conf]
    ports:
      - '127.0.0.1:8884:8883'
    networks:
      tls-test:
        aliases: [mosquitto]
    volumes:
      - ./infra/mosquitto/config/mosquitto-test.conf:/mosquitto/config/mosquitto-test.conf:ro
      - ./infra/mosquitto/config/acl-test:/mosquitto/config/acl-test:ro
      - ./infra/mosquitto/secrets/passwords:/mosquitto/config/passwd-test:ro
      - ./infra/mosquitto/secrets/test-password:/mosquitto/secrets/test-password:ro
      - ./infra/mosquitto/certs:/mosquitto/certs:ro
      - ./infra/mosquitto/scripts:/mosquitto/scripts:ro
  api:
    <<: *app
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/v1/health').then(async r=>{if(!r.ok || (await r.json()).db!=='ok') process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
  ingest:
    <<: *app
    env_file: ./secrets/services/svc-ingest.env
    build:
      context: .
      target: ingest
  publisher:
    <<: *app
    env_file: ./secrets/services/svc-publisher.env
    build:
      context: .
      target: publisher
volumes:
  mqtt-data:
networks:
  tls-test:
